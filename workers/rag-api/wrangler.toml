name = "hdcx-rag-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "ragapi.hdcxb.net", custom_domain = true }]

[ai]
binding = "AI"

# QDRANT_URL、QDRANT_API_KEY、EMBED_API_KEY（硅基流动，可选）为 secret（wrangler secret put），不写在这里
[vars]
QDRANT_COLLECTION = "hdcx"
ALLOWED_ORIGINS = "https://huidengchanxiu.net,https://www.huidengchanxiu.net"
ALLOW_DEV_ORIGINS = "true"
# Workers AI 生成问题向量失败（额度用完等）时改用硅基流动的 bge-m3（需设置 secret EMBED_API_KEY），向量与 Workers AI 一致
EMBED_API_URL = "https://api.siliconflow.cn/v1/embeddings"
# 单一分类内搜索取前 TOP_K 个候选；跨分类时取全局前 TOP_K_MIXED 个，另每个分类各取前 CAT_K 个，
# 避免内容最多的参考资料挤掉课程法本等
TOP_K = "50"
TOP_K_MIXED = "30"
CAT_K = "8"
# 重排后保留分数 >= RERANK_MIN 的段落（bge-reranker-base，0~1；实测无关问题多在 0.2 以下、偶有 0.52 的误报，相关段落 0.62~0.99）
RERANK_MIN = "0.6"
# 重排输入以关键句为中心截取的字数（模型单段上限 512 token；实测 380 比全文和 460 效果好且省约 1/3 Neurons）
RERANK_CHARS = "380"
# 以下为重排失败时的回退阈值：保留 score >= max(MIN_SCORE, 第一名 - REL_GAP)
MIN_SCORE = "0.52"
REL_GAP = "0.10"
# 块内包含查询关键词（去掉疑问词）时加分，多次出现递增，最多再加 0.03
KEYWORD_BONUS = "0.03"
MAX_HITS_PER_DOC = "5"
# 视频命中显示关键行前后各几行字幕
CONTEXT_LINES = "2"
MAX_DOCS = "10"
CACHE_TTL = "86400"
# 重建索引后递增，使结果缓存失效
INDEX_VERSION = "15"
