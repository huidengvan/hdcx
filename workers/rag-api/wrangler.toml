name = "hdcx-rag-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "ragapi.hdcxb.net", custom_domain = true }]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "hdcx-rag"

[vars]
ALLOWED_ORIGINS = "https://huidengchanxiu.net,https://www.huidengchanxiu.net"
ALLOW_DEV_ORIGINS = "true"
TOP_K = "50"
# 重排后保留分数 >= RERANK_MIN 的段落（bge-reranker-base，0~1；实测无关问题最高约 0.17，相关段落 0.8~0.99）
RERANK_MIN = "0.5"
# 以下为重排失败时的回退阈值：保留 score >= max(MIN_SCORE, 第一名 - REL_GAP)
MIN_SCORE = "0.52"
REL_GAP = "0.10"
# 块内包含查询关键词（去掉疑问词）时加分，多次出现递增，最多再加 0.03
KEYWORD_BONUS = "0.03"
MAX_HITS_PER_DOC = "5"
MAX_DOCS = "10"
CACHE_TTL = "86400"
# 重建索引后递增，使结果缓存失效
INDEX_VERSION = "5"
